<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F6F3EC">
  <meta name="description" content="每天翻开四张卡片，留下一句鼓励。">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="四格打卡">
  <title>四格打卡</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span class="brand-name">四格打卡</span>
    </div>
    <div class="top-actions">
      <button id="installBtn" class="icon-button" type="button" title="安装应用" aria-label="安装应用" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <path d="m7 10 5 5 5-5"></path>
          <path d="M12 15V3"></path>
        </svg>
      </button>
      <div class="streak-pill" id="streakPill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path>
        </svg>
        <span class="streak-label">坚持</span>
        <strong id="streakCount" aria-live="polite">0</strong>
        <span>天</span>
      </div>
    </div>
  </header>

  <main class="board">
    <section class="card-grid" aria-label="每日励志卡片">
      <button class="card" type="button" aria-pressed="false" aria-label="翻开晨光卡片">
        <span class="card-inner">
          <span class="card-face card-front card-front--sun">
            <span class="card-number">01</span>
            <svg class="card-symbol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2"></path>
              <path d="M12 20v2"></path>
              <path d="m4.93 4.93 1.41 1.41"></path>
              <path d="m17.66 17.66 1.41 1.41"></path>
              <path d="M2 12h2"></path>
              <path d="M20 12h2"></path>
              <path d="m6.34 17.66-1.41 1.41"></path>
              <path d="m19.07 4.93-1.41 1.41"></path>
            </svg>
            <span class="card-title">晨光</span>
          </span>
          <span class="card-face card-back">
            <span class="quote-mark">“</span>
            <span class="quote-text">种一棵树最好的时间是十年前，其次是现在。</span>
            <span class="card-dots">···</span>
          </span>
        </span>
      </button>

      <button class="card" type="button" aria-pressed="false" aria-label="翻开山巅卡片">
        <span class="card-inner">
          <span class="card-face card-front card-front--teal">
            <span class="card-number">02</span>
            <svg class="card-symbol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m8 3 4 8 5-5 5 15H2L8 3z"></path>
            </svg>
            <span class="card-title">山巅</span>
          </span>
          <span class="card-face card-back">
            <span class="quote-mark">“</span>
            <span class="quote-text">山再高，往上攀，总能登顶。</span>
            <span class="card-dots">···</span>
          </span>
        </span>
      </button>

      <button class="card" type="button" aria-pressed="false" aria-label="翻开月夜卡片">
        <span class="card-inner">
          <span class="card-face card-front card-front--amber">
            <span class="card-number">03</span>
            <svg class="card-symbol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
            </svg>
            <span class="card-title">月夜</span>
          </span>
          <span class="card-face card-back">
            <span class="quote-mark">“</span>
            <span class="quote-text">你坚持的东西，总有一天会反过来拥抱你。</span>
            <span class="card-dots">···</span>
          </span>
        </span>
      </button>

      <button class="card" type="button" aria-pressed="false" aria-label="翻开星海卡片">
        <span class="card-inner">
          <span class="card-face card-front card-front--violet">
            <span class="card-number">04</span>
            <svg class="card-symbol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path>
            </svg>
            <span class="card-title">星海</span>
          </span>
          <span class="card-face card-back">
            <span class="quote-mark">“</span>
            <span class="quote-text">每天进步一点点，坚持带来大改变。</span>
            <span class="card-dots">···</span>
          </span>
        </span>
      </button>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
